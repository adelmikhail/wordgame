<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Power Game (CSW Validation)</title>
<link rel="stylesheet" href="./wordgame.css">
</head>

<body>

<h1>Word Power Game</h1>

<div id="wordArea"></div>

<div id="keyboard"></div>

<div id="scoreBox">
  Total Power Used: <span id="usedPower">0</span> /
  <span id="totalPower">50</span> |
  Power Left: <span id="powerLeft">50</span>
</div>

<button id="clearBtn" onclick="clearWord()">Clear</button>
<button id="submitBtn" onclick="submitWord()">Submit</button>

<h2 id="submittedWordsTitle">Your Words:</h2>
<div id="submittedWords"></div>
<script src="./wordgame.js"></script>
</body>
